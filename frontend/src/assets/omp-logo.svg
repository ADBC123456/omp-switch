<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">OMP Switch icon</title>
  <desc id="desc">The glowing violet and cyan OMP Switch application mark.</desc>
  <defs>
    <linearGradient id="mainGradient" x1="472" y1="274" x2="1008" y2="724" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5fe3"/>
      <stop offset="0.42" stop-color="#c565ff"/>
      <stop offset="0.72" stop-color="#654cff"/>
      <stop offset="1" stop-color="#31d3ff"/>
    </linearGradient>

    <linearGradient id="capGradient" x1="500" y1="246" x2="1110" y2="344" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff67df"/>
      <stop offset="0.48" stop-color="#c565ff"/>
      <stop offset="1" stop-color="#9f74ff"/>
    </linearGradient>

    <linearGradient id="dropGradient" x1="906" y1="652" x2="1030" y2="716" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b55ff"/>
      <stop offset="1" stop-color="#35d5ff"/>
    </linearGradient>

    <filter id="softGlow" x="-35%" y="-40%" width="170%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="34" result="blurA"/>
      <feColorMatrix in="blurA" result="pinkGlow" type="matrix" values="
        1 0 0 0 0.95
        0 1 0 0 0.22
        0 0 1 0 0.95
        0 0 0 0.72 0"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="11" result="blurB"/>
      <feMerge>
        <feMergeNode in="pinkGlow"/>
        <feMergeNode in="blurB"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cyanGlow" x="-120%" y="-120%" width="340%" height="340%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feColorMatrix in="blur" result="glow" type="matrix" values="
        0.1 0 0 0 0.10
        0 0.7 0 0 0.65
        0 0 1 0 1.00
        0 0 0 0.82 0"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#softGlow)">
    <path
